name: Restore Past President Portraits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-president-portraits.yml"
      - "scripts/restore_presidents.py"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU restoration stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8 realesrgan==0.3.0 pillow==10.4.0
          python -m pip install --force-reinstall numpy==1.26.4 opencv-python==4.10.0.84 opencv-python-headless==4.10.0.84

      - name: Download restoration weights
        run: |
          mkdir -p .restore-weights
          curl -L --fail --retry 3             https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth             -o .restore-weights/RealESRGAN_x2plus.pth
          curl -L --fail --retry 3             https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth             -o .restore-weights/GFPGANv1.4.pth

      - name: Restore presidents 1 through 59
        run: python scripts/restore_presidents.py

      - name: Verify portrait output
        run: |
          test "$(find assets/presidents -name 'president-*.webp' | wc -l)" -eq 59
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("assets/presidents").glob("president-*.webp"))
          for path in files:
              with Image.open(path) as im:
                  if im.width < 600 or im.height < 850:
                      raise SystemExit(f"{path} too small: {im.size}")
          print(f"Verified {len(files)} restored portraits")
          PY

      - name: Commit restored portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/presidents
          if git diff --cached --quiet; then
            echo "No portrait changes to commit."
          else
            git commit -m "Restore past president portraits with GFPGAN and Real-ESRGAN"
            git push origin main
          fi
